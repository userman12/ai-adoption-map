<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Adoption Map</title>
<meta name="description" content="How fast is AI spreading through European businesses? Share of enterprises (10+ employees) using at least one AI technology, by country, 2021 to today. Source: Eurostat.">
<meta name="color-scheme" content="light dark">
<link rel="preload" href="fonts/schibsted-grotesk-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<header class="top">
  <h1 data-i18n="title"></h1>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="en" lang="en">EN</button>
    <button data-l="it" lang="it">IT</button>
  </div>
  <p class="sub" data-i18n="sub"></p>
</header>

<section class="pulse" aria-label="EU27">
  <div class="hero">
    <p class="sr-only" id="heroSr" aria-live="polite"></p>
    <p class="hero-ind" id="heroInd"></p>
    <p class="hero-key"><i class="eu-dot"></i><span id="heroLabel"></span></p>
    <p class="hero-num" id="heroNum" aria-hidden="true">—</p>
    <p class="hero-delta" id="heroDelta"></p>
  </div>
  <div class="years-wrap">
    <p class="ctl-lbl" id="yearLbl" data-i18n="year"></p>
    <div class="years" id="years" role="group" aria-labelledby="yearLbl"></div>
  </div>
  <button class="play" id="play" aria-pressed="false"></button>
</section>

<div class="sizes-row">
  <div class="ctl ctl-ind">
    <label class="ctl-lbl" for="ind" data-i18n="indicator"></label>
    <select id="ind"></select>
  </div>
  <div class="ctl">
    <p class="ctl-lbl" id="sizeLbl" data-i18n="size"></p>
    <div class="seg" id="sizes" role="group" aria-labelledby="sizeLbl">
      <button data-s="all"></button>
      <button data-s="small"></button>
      <button data-s="medium"></button>
      <button data-s="large"></button>
    </div>
  </div>
  <div class="ctl">
    <p class="ctl-lbl" id="viewLbl" data-i18n="view"></p>
    <div class="seg" id="views" role="group" aria-labelledby="viewLbl">
      <button data-v="map"></button>
      <button data-v="globe"></button>
    </div>
  </div>
</div>

<main class="grid">
  <figure class="mapwrap">
    <svg id="map" viewBox="0 0 600 620" role="group"></svg>
    <div class="tip" id="tip" role="status" hidden></div>
    <figcaption class="legend" id="legend"></figcaption>
  </figure>

  <section class="rank" id="rank" aria-live="off">
    <div id="rankView">
      <h2 id="rankTitle"></h2>
      <p class="hint" data-i18n="hint"></p>
      <div class="euref" id="euRef"></div>
      <ol id="rankList"></ol>
      <p class="note" id="missing"></p>
    </div>
    <div class="profile" id="profile" hidden></div>
  </section>
</main>

<aside class="series">
  <h2 data-i18n="seriesKicker"></h2>
  <p><span data-i18n="seriesText"></span> <a id="part1" data-i18n="seriesLink"></a></p>
</aside>

<footer class="ft">
  <p><span data-i18n="source"></span> <a id="srcLink">Eurostat</a>, <span data-i18n="dataset"></span> <code>isoc_eb_ai</code>, <span data-i18n="extracted"></span> <span id="extracted">—</span>.</p>
  <p><span data-i18n="builtBy"></span> <a id="author"></a> · <span data-i18n="privacy"></span></p>
</footer>
</body>
</html>
