<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Adoption Map</title>
<meta name="description" content="How fast is AI spreading through European businesses? Share of enterprises (10+ employees) using at least one AI technology, by country, 2021 to today. Source: Eurostat.">
<meta name="color-scheme" content="light dark">
<script>
  // theme before first paint: the visitor's saved choice, else the system setting
  try { var theme = localStorage.getItem("theme"); } catch (e) {}
  document.documentElement.dataset.theme = theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
<link rel="preload" href="fonts/schibsted-grotesk-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<header class="top">
  <h1 data-i18n="title"></h1>
  <div class="prefs">
    <div class="lang" role="group" aria-label="Language">
      <button data-l="en" lang="en">EN</button>
      <button data-l="it" lang="it">IT</button>
    </div>
    <button class="theme" id="theme" type="button">
      <svg class="i-moon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M13.5 9.6A5.75 5.75 0 0 1 6.4 2.5a5.75 5.75 0 1 0 7.1 7.1z"/></svg>
      <svg class="i-sun" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5V3M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06"/></svg>
    </button>
  </div>
  <p class="sub" data-i18n="sub"></p>
</header>

<section class="pulse" aria-label="EU27">
  <div class="hero">
    <p class="sr-only" id="heroSr" aria-live="polite"></p>
    <p class="hero-ind" id="heroInd"></p>
    <p class="hero-key"><i class="eu-dot"></i><span id="heroLabel"></span></p>
    <p class="hero-num" id="heroNum" aria-hidden="true">—</p>
    <p class="hero-delta" id="heroDelta"></p>
  </div>
  <div class="years-wrap">
    <!-- header of the year chart: its label on the left, its one action on the right -->
    <div class="years-head">
      <p class="ctl-lbl" id="yearLbl" data-i18n="year"></p>
      <button class="play" id="play" type="button">
        <svg class="i-play" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 1.4v9.2a.7.7 0 0 0 1.06.6l7.6-4.6a.7.7 0 0 0 0-1.2L3.56.8a.7.7 0 0 0-1.06.6z"/></svg>
        <svg class="i-pause" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="2" y="1.5" width="3" height="9" rx=".8"/><rect x="7" y="1.5" width="3" height="9" rx=".8"/></svg>
        <span id="playTxt"></span>
      </button>
    </div>
    <div class="years" id="years" role="group" aria-labelledby="yearLbl" aria-describedby="yearNote"></div>
  </div>
  <p class="ynote" id="yearNote" hidden></p>
</section>

<div class="filters">
  <div class="ctl">
    <label class="ctl-lbl" for="ind" data-i18n="indicator"></label>
    <select id="ind"></select>
  </div>
  <div class="ctl">
    <label class="ctl-lbl" for="sector" data-i18n="sector"></label>
    <select id="sector"></select>
  </div>
  <div class="ctl ctl-size">
    <p class="ctl-lbl" id="sizeLbl" data-i18n="size"></p>
    <div class="seg" id="sizes" role="group" aria-labelledby="sizeLbl">
      <button data-s="all"></button>
      <button data-s="small"></button>
      <button data-s="medium"></button>
      <button data-s="large"></button>
    </div>
  </div>
  <p class="ctl-note" id="sizeNote" data-i18n="sectorNote" hidden></p>
</div>

<main class="grid">
  <figure class="mapwrap">
    <!-- map or globe: a control of the map panel itself -->
    <div class="seg views" id="views" role="group">
      <button data-v="map"></button>
      <button data-v="globe"></button>
    </div>
    <svg id="map" viewBox="0 0 600 620" role="group"></svg>
    <div class="tip" id="tip" role="status" hidden></div>
    <figcaption class="legend" id="legend"></figcaption>
  </figure>

  <section class="rank" id="rank" aria-live="off">
    <div id="rankView">
      <h2 id="rankTitle"></h2>
      <p class="hint" data-i18n="hint"></p>
      <div class="euref" id="euRef"></div>
      <ol id="rankList"></ol>
      <p class="note" id="missing"></p>
    </div>
    <div class="profile" id="profile" hidden></div>
  </section>
</main>

<section class="gapsec" id="gapSec" aria-labelledby="gapTitle">
  <div class="gap-head">
    <div>
      <h2 id="gapTitle" data-i18n="gapTitle"></h2>
      <p class="hint" id="gapSub"></p>
    </div>
    <div class="ctl">
      <p class="ctl-lbl" id="sortLbl" data-i18n="sortBy"></p>
      <div class="seg" id="gapSort" role="group" aria-labelledby="sortLbl">
        <button data-o="gap"></button>
        <button data-o="small"></button>
        <button data-o="large"></button>
      </div>
    </div>
  </div>
  <p class="gap-key" id="gapKey"></p>
  <p class="hint" id="gapHint" data-i18n="gapHint"></p>
  <div id="gapBody">
    <div class="gap-axis" id="gapAxis" aria-hidden="true"></div>
    <div class="gap-row gap-eu" id="gapEu">
      <span class="nm"><i class="eu-dot"></i><span class="cn" data-i18n="eu"></span></span>
      <span class="trk"><i class="ln"></i><i class="dt small"></i><i class="dt medium"></i><i class="dt large"></i></span>
      <span class="val"></span>
    </div>
    <ol class="gap-list" id="gapList"></ol>
  </div>
  <p class="note" id="gapNote"></p>
  <div class="tip" id="gapTip" role="status" hidden></div>
</section>

<aside class="series">
  <h2 data-i18n="seriesKicker"></h2>
  <p><span data-i18n="seriesText"></span> <a id="part1" data-i18n="seriesLink"></a></p>
</aside>

<footer class="ft">
  <p><span data-i18n="source"></span> Eurostat, <span data-i18n="dataset"></span> <a id="srcLink"><code>isoc_eb_ai</code></a> <span data-i18n="and"></span> <a id="srcLink2"><code>isoc_eb_ain2</code></a>, <span data-i18n="extracted"></span> <span id="extracted">—</span>.</p>
  <p><span data-i18n="builtBy"></span> <a id="author"></a> · <span data-i18n="privacy"></span></p>
</footer>
</body>
</html>
